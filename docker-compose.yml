version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: foodie-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: foodie-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
